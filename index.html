<!doctype html>
<html lang="en" data-theme="cream">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Reader</title>
  <meta name="theme-color" content="#f6efdc">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Reader">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="stylesheet" href="css/app.css">
  <script type="module" src="js/main.js"></script>
</head>
<body>
  <!-- Icons, used with <svg><use href="#i-name"/></svg> -->
  <svg width="0" height="0" style="position:absolute" aria-hidden="true">
    <defs>
      <symbol id="i-back" viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></symbol>
      <symbol id="i-text" viewBox="0 0 24 24"><path d="M3 19l5-13 5 13M4.8 14.5h6.4M15 19v-6.5a3 3 0 016 0V19M21 15.5c-1.5-.6-6-.8-6 1.6 0 2.6 4.6 2.4 6 .4" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></symbol>
      <symbol id="i-list" viewBox="0 0 24 24"><path d="M9 6h11M9 12h11M9 18h11M4 6h.01M4 12h.01M4 18h.01" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/></symbol>
      <symbol id="i-marker" viewBox="0 0 24 24"><path d="M4 20h8M14.5 4.5l5 5L11 18H6v-5z" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></symbol>
      <symbol id="i-ruler" viewBox="0 0 24 24"><path d="M4 5h16M4 19h16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" opacity=".45"/><rect x="2.5" y="9" width="19" height="6" rx="2" fill="none" stroke="currentColor" stroke-width="2"/></symbol>
      <symbol id="i-speaker" viewBox="0 0 24 24"><path d="M4 9.5v5h4l5 4v-13l-5 4zM16.5 9a4 4 0 010 6M19 6.5a7.5 7.5 0 010 11" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></symbol>
      <symbol id="i-page" viewBox="0 0 24 24"><path d="M6 3h8l4 4v14H6zM14 3v4h4M9 12h6M9 16h6" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/></symbol>
      <symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/></symbol>
      <symbol id="i-minus" viewBox="0 0 24 24"><path d="M5 12h14" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/></symbol>
      <symbol id="i-sync" viewBox="0 0 24 24"><path d="M4 12a8 8 0 0113.7-5.6L20 8.5M20 4v4.5h-4.5M20 12a8 8 0 01-13.7 5.6L4 15.5M4 20v-4.5h4.5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></symbol>
      <symbol id="i-close" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/></symbol>
      <symbol id="i-play" viewBox="0 0 24 24"><path d="M7 4.5v15l12.5-7.5z" fill="currentColor"/></symbol>
      <symbol id="i-pause" viewBox="0 0 24 24"><path d="M7 5h3.5v14H7zM13.5 5H17v14h-3.5z" fill="currentColor"/></symbol>
      <symbol id="i-stop" viewBox="0 0 24 24"><rect x="6" y="6" width="12" height="12" rx="1.5" fill="currentColor"/></symbol>
      <symbol id="i-more" viewBox="0 0 24 24"><path d="M5 12h.01M12 12h.01M19 12h.01" fill="none" stroke="currentColor" stroke-width="3.4" stroke-linecap="round"/></symbol>
      <symbol id="i-note" viewBox="0 0 24 24"><path d="M5 4h14v11l-5 5H5zM14 20v-5h5M8.5 9h7M8.5 12.5h4" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/></symbol>
      <symbol id="i-trash" viewBox="0 0 24 24"><path d="M4 7h16M9 7V4.5h6V7M6.5 7l1 13h9l1-13" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/></symbol>
    </defs>
  </svg>

  <!-- LIBRARY -->
  <main id="library" hidden>
    <header class="lib-bar">
      <h1>My books</h1>
      <div class="row">
        <button id="sync-btn" class="btn"><svg><use href="#i-sync"/></svg>Sync</button>
        <button id="add-btn" class="btn primary"><svg><use href="#i-plus"/></svg>Add book</button>
      </div>
    </header>
    <div id="shelf" class="shelf"></div>
    <div id="missing" class="missing" hidden></div>
    <input id="file-input" type="file" multiple hidden>
  </main>

  <!-- READER -->
  <section id="reader" hidden>
    <div id="viewport"><div id="flow" class="book"></div></div>
    <div id="pdf-view" hidden><canvas id="pdf-canvas"></canvas></div>
    <div id="ruler" hidden></div>
    <div id="page-info" class="page-info" aria-live="polite"></div>

    <header id="top-bar" class="overlay top">
      <button id="back-btn" class="btn ghost"><svg><use href="#i-back"/></svg>Library</button>
      <div id="book-title" class="book-title"></div>
      <button id="settings-btn" class="btn ghost"><svg><use href="#i-text"/></svg>Text</button>
    </header>

    <footer id="bottom-bar" class="overlay bottom">
      <div id="where" class="where"></div>
      <div class="tools">
        <button id="toc-btn" class="tool"><svg><use href="#i-list"/></svg>Contents</button>
        <button id="hl-btn" class="tool"><svg><use href="#i-marker"/></svg>Highlights</button>
        <button id="ruler-btn" class="tool" aria-pressed="false"><svg><use href="#i-ruler"/></svg>Ruler</button>
        <button id="tts-btn" class="tool"><svg><use href="#i-speaker"/></svg>Listen</button>
        <button id="pdfview-btn" class="tool" aria-pressed="false" hidden><svg><use href="#i-page"/></svg>Original</button>
      </div>
    </footer>

    <div id="sel-menu" class="sel-menu" hidden>
      <button data-color="yellow" class="swatch-btn"><span class="dot yellow"></span>Yellow</button>
      <button data-color="green" class="swatch-btn"><span class="dot green"></span>Green</button>
      <button data-color="blue" class="swatch-btn"><span class="dot blue"></span>Blue</button>
      <button data-act="note" class="swatch-btn"><svg><use href="#i-note"/></svg>Note</button>
      <button data-act="remove" class="swatch-btn" hidden><svg><use href="#i-trash"/></svg>Remove</button>
    </div>

    <div id="tts-bar" class="tts-bar" hidden>
      <button id="tts-play" class="btn round" aria-label="Pause"><svg><use href="#i-pause"/></svg></button>
      <button id="tts-slower" class="btn round" aria-label="Slower"><svg><use href="#i-minus"/></svg></button>
      <span id="tts-rate" class="rate">1.0×</span>
      <button id="tts-faster" class="btn round" aria-label="Faster"><svg><use href="#i-plus"/></svg></button>
      <button id="tts-stop" class="btn round" aria-label="Stop"><svg><use href="#i-stop"/></svg></button>
    </div>
  </section>

  <!-- Side / bottom sheet used for Settings, Contents, Highlights and Sync -->
  <div id="scrim" hidden></div>
  <aside id="panel" class="panel" hidden role="dialog" aria-modal="false" aria-labelledby="panel-title">
    <header>
      <h2 id="panel-title"></h2>
      <button id="panel-close" class="btn ghost"><svg><use href="#i-close"/></svg>Close</button>
    </header>
    <div id="panel-body"></div>
  </aside>

  <dialog id="dialog"></dialog>
  <div id="busy" hidden><div class="busy-box"><p id="busy-text"></p><progress id="busy-bar"></progress></div></div>
  <div id="toast" role="status" hidden></div>
</body>
</html>
